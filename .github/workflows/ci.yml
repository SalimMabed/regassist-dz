name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression & Freeze Invariants (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r deploy/requirements-deploy.txt

      - name: Verify & Resolve Runtime Vectors
        run: |
          python -m deploy.ensure_vectors replication/index

      - name: Run Freeze Invariants Tests
        run: |
          python tests/test_phase5_freeze.py

      - name: Run API Unit Tests
        run: |
          python local_app/tests/test_api.py

      - name: Run Waiting Queue Tests
        run: |
          python local_app/tests/test_queue.py

      - name: Run Persistent Tracking Tests
        run: |
          python local_app/tests/test_persist.py

      - name: Run Web Push Tests
        run: |
          python local_app/tests/test_webpush.py

      - name: Run Quiz Question Bank Tests
        run: |
          python local_app/tests/test_quiz_data.py

      - name: Run Quiz Logic Tests
        run: |
          node --test local_app/tests/test_quiz.mjs

      - name: Run Grounding Guard Tests
        run: |
          python local_app/tests/test_grounding.py

      - name: Run Courtesy & Smalltalk Tests
        run: |
          python local_app/tests/test_smalltalk.py

      - name: Run LAN Security Tests
        run: |
          python local_app/tests/test_lan.py

      - name: Run Headless UI Test Suite
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          python local_app/tests/test_ui.py
