# ==============================================================================
# RegAssist DZ - Hardened Nginx Reverse Proxy & TLS Configuration
# ==============================================================================
# Target Platform: Ubuntu 24.04 LTS / Nginx >= 1.19.4
# Upstream: Gunicorn on 127.0.0.1:8790 (deploy.wsgi:app)
#
# Security Properties:
# 1. Unknown Host/SNI dropped at TCP/TLS boundary (444 / ssl_reject_handshake)
# 2. Trusted reverse proxy overwrites X-Forwarded-* headers (prevents header spoofing)
# 3. HTTP redirects strictly to HTTPS
# 4. Generous read timeout (240s) for single-flight CPU inference
# 5. Access: open by default (public service with a waiting queue, see local_app/waitqueue.py). For a
#    private evaluation, setup_vps.sh --private (or update_vps.sh --private) enables HTTP Basic
#    authentication on the whole site through the two auth_basic lines below (password file
#    /etc/nginx/regassist.htpasswd). Gunicorn itself has no access gate in this deployment.

# Rate limiting zones (evaluated in http context)
# Chat endpoint: 10 requests per minute per client IP (with 10m shared memory zone ~160k IPs)
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# Waiting queue: submitting or cancelling a question (POST) is limited like /api/chat; the status
# polling done by the page every 2 seconds (GET) has its own, larger budget per client IP. An empty
# key means "not limited": each map keeps the other method out of the zone.
map $request_method $queue_post_key { POST $binary_remote_addr; default ""; }
map $request_method $queue_poll_key { POST ""; default $binary_remote_addr; }
limit_req_zone $queue_post_key zone=queue_post:10m rate=10r/m;
limit_req_zone $queue_poll_key zone=queue_poll:10m rate=300r/m;

# 1. Default catch-all HTTP server: immediately drop unrecognized Host headers
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 2. Default catch-all HTTPS server: reject unknown SNI/TLS handshakes (Nginx >= 1.19.4)
#    and drop any request that completes a handshake with an unrecognized Host header
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    return 444;
}

# 3. Redirect valid production HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM;
    return 301 https://$host$request_uri;
}

# 4. Production HTTPS Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.COM;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;

    # TLS protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Private access (disabled by default; setup_vps.sh/update_vps.sh --private remove the leading '#'):
    # inherited by every location below, the credentials are never forwarded upstream.
    #auth_basic "RegAssist DZ - private evaluation";
    #auth_basic_user_file /etc/nginx/regassist.htpasswd;

    # Chat endpoint with strict rate limiting (10 req/min, burst=2) and connection limit
    location /api/chat {
        limit_req zone=chat_limit burst=2 nodelay;
        limit_conn addr_limit 2;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 240s;
    }

    # Waiting queue: a question is a short POST that returns a ticket, then the page polls the ticket
    # (no request stays open while waiting, so no proxy timeout applies to the queue itself).
    location /api/queue {
        limit_req zone=queue_post burst=3 nodelay;
        limit_req zone=queue_poll burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Static UI, assets, and unthrottled health/status routes
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        # Overwrite client-supplied headers with trusted server values
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";

        # Upstream timeouts:
        # proxy_read_timeout covers silent wait while Flask/llama.cpp generates buffered JSON
        # proxy_send_timeout is a request-transmission safeguard (Nginx -> Gunicorn)
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 240s;
    }
}
